site_name: CareGraph Documentation
site_description: Open Health & Care Infrastructure Graph for Germany
site_author: CareGraph Team
site_url: https://lwsnlab.github.io/CareGraph_Doc/
repo_url: https://github.com/LWSNLab/CareGraph_Doc
repo_name: LWSNLab/CareGraph_Doc

# Story template lives in the repo for copying, but is not a rendered page.
exclude_docs: |
  pm/stories/_template.md

copyright: >
  &copy; 2026 CareGraph (LWSNLab) —
  Documentation licensed under
  <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>.

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Overview: index.md
  - Architecture:
      - System Overview: architecture/system-overview.md
      - Data Schema: architecture/data-schema.md
      - Security & Privacy: architecture/security.md
  - Data & Legal:
      - Data Sources & Licensing: legal/data-licensing.md
  - API Specification: api/openapi-spec.md
  - Project Management:
      - PRD: pm/prd.md
      - Epics & Stories:
          - Overview: pm/stories/index.md
          - 1 · Ingestion & ETL:
